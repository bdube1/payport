# Payport Commerce: its own build and tests (Testcontainers MySQL and a stand-in PSP). Runs only when Commerce changes.
name: commerce

on:
  push:
    branches: [ main ]
    paths: [ 'commerce/**', '.github/workflows/commerce.yml' ]
  pull_request:
    paths: [ 'commerce/**', '.github/workflows/commerce.yml' ]

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: commerce/pom.xml
      - name: Docker API version for Testcontainers
        run: echo "api.version=$(docker version --format '{{.Server.APIVersion}}')" > ~/.docker-java.properties
      - name: mvn verify
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log || {
            grep -E '^\[ERROR\] .*\.java:\[' build.log | sed 's/^\[ERROR\] //' | head -40 | sed 's/^/::error::/'
            grep -E 'Tests run:|FAIL|expected' build.log | tail -30 | sed 's/^/::error::/'
            exit 1
          }
      - name: Failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          def esc(t): return t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or '')[:1500]
                      trace = '\n'.join(l for l in (bad.text or '').splitlines() if 'zw.co.payport' in l)[:1500]
                      print('::error title=' + esc(case.get('name', 'test')[:120]) + '::' + esc(msg + '\n' + trace))
          PY
      - name: Test totals
        if: always()
        run: |
          t=$(grep -h -o 'tests="[0-9]*"' target/surefire-reports/*.xml 2>/dev/null | grep -o '[0-9]*' | paste -sd+ | bc || echo 0)
          f=$(grep -h -o 'failures="[0-9]*"' target/surefire-reports/*.xml 2>/dev/null | grep -o '[0-9]*' | paste -sd+ | bc || echo 0)
          s=$(grep -h -o 'skipped="[0-9]*"' target/surefire-reports/*.xml 2>/dev/null | grep -o '[0-9]*' | paste -sd+ | bc || echo 0)
          echo "::notice title=commerce tests::$t tests, $f failures, $s skipped"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-surefire-reports
          path: commerce/target/surefire-reports/
          if-no-files-found: warn
