# =====================================================
# SMS GATEWAY (Africa's Talking)
# =====================================================
# NOTE: username below is still "sandbox" -- this is Africa's Talking's
# TEST mode identifier. Real SMS delivery to customers requires a live
# Africa's Talking account username, not "sandbox".
payport.sms.provider=AFRICAS_TALKING
payport.sms.africas-talking.username=${AFRICAS_TALKING_USERNAME:sandbox}
payport.sms.africas-talking.api-key=${AFRICAS_TALKING_API_KEY:}
payport.sms.africas-talking.sender-id=${AFRICAS_TALKING_SENDER_ID:}
payport.sms.africas-talking.base-url=https://api.sandbox.africastalking.com/version1/messaging

# =====================================================
# ACTUATOR (monitoring)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Phase 9: Kubernetes-style probes (/actuator/health/liveness, /actuator/health/readiness);
# the Prometheus scrape needs PAYPORT_METRICS_TOKEN (MetricsTokenFilter); none set = no endpoint.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
payport.metrics.token=${PAYPORT_METRICS_TOKEN:}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=200ms,500ms,1s,2s
management.metrics.tags.application=payport-gateway
# Phase 9: finish in-flight requests on shutdown (rolling deploys never cut a payment mid-request).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Phase 9: extra https browser origins for CORS in production (comma-separated); localhost only outside production.
payport.cors.extra-origins=${PAYPORT_CORS_EXTRA_ORIGINS:}
management.endpoint.health.show-details=when-authorized
# Email is not critical to taking payments: an SMTP outage or bad SMTP password must not mark the
# payment API unhealthy (load balancers / container health checks would pull or restart it).
# Found by ApplicationSmokeTest in CI. Monitor email delivery separately.
management.health.mail.enabled=false

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
