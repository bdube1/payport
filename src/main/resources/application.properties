# =====================================================
# PAYPORT GATEWAY - Application Configuration
# =====================================================
#
# Secrets are read from environment variables with no fallback default --
# see .env.example for the full list. Populate your deployment
# environment before starting the app.

spring.application.name=payport-gateway
server.port=8084

# =====================================================
# DATABASE - MYSQL
# =====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================
# JPA / HIBERNATE
# =====================================================
# Flyway owns the schema. 'update' is kept as the default only so the existing gateway
# entities keep starting while they are brought in line; set JPA_DDL_AUTO=validate in
# staging first, fix anything it reports, then use validate in production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =====================================================
# FLYWAY
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================
# CONNECTION POOL
# =====================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# =====================================================
# JACKSON
# =====================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=NON_NULL

# =====================================================
# LOGGING - CLEAN AND QUIET (Only important messages)
# =====================================================
logging.level.root=WARN
logging.level.zw.co.payport=INFO
logging.level.zw.co.payport.gateway.service.adaptor.econet=INFO
logging.level.zw.co.payport.gateway.scheduler.ProviderHealthScheduler=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.apache.http=OFF
logging.level.org.apache.hc.client5.http=OFF
logging.level.org.apache.hc.core5.http=OFF

# Console pattern - clean and readable
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) [%yellow(%thread)] %cyan(%logger{36}) - %msg%n

# =====================================================
# SECURITY - JWT
# =====================================================
payport.security.jwt-secret=${JWT_SECRET}
payport.security.jwt-expiration-ms=3600000
payport.security.jwt-refresh-expiration-ms=2592000000

# =====================================================
# EMAIL (staff password reset)
# =====================================================
# No defaults on purpose -- if these aren't set, the app still starts (mail
# isn't in the critical startup path) but forgotPassword() will fail loudly
# when actually invoked, which is the right failure mode: better an obvious
# error than a silently undelivered reset email.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
payport.email.from=${SMTP_FROM:no-reply@payport.africa}
payport.email.reset-link-base=https://admin.payport.africa/reset-password

# =====================================================
# GATEWAY CORE SETTINGS
# =====================================================
payport.gateway.base-url=https://api.payport.africa
payport.gateway.callback-base-url=https://api.payport.africa

# Where the consumer app (hosted checkout pages, etc.) is actually
# reachable -- used to build redirect URLs back to it, e.g. after a
# ZimSwitch card payment completes. Override with CONSUMER_BASE_URL in
# .env for local testing (http://localhost:3000); defaults safely to
# production if not set.
payport.consumer.base-url=${CONSUMER_BASE_URL:https://app.payport.africa}
payport.website.base-url=${WEBSITE_BASE_URL:https://www.payport.africa}
payport.gateway.default-currency=USD
payport.gateway.payment-timeout-seconds=180
payport.gateway.max-fulfilment-retries=4
payport.gateway.retry-delays-seconds=30,120,300,600

# =====================================================
# ECOCASH CONFIGURATION
# =====================================================
payport.ecocash.base-url=https://payonline.econet.co.zw/ecocashGateway/payment/v1
payport.ecocash.notify-url=${payport.gateway.callback-base-url}/api/v1/callbacks/ecocash
payport.ecocash.merchant-code=${ECOCASH_MERCHANT_CODE:}
payport.ecocash.merchant-pin=${ECOCASH_MERCHANT_PIN:}
payport.ecocash.merchant-number=${ECOCASH_MERCHANT_NUMBER:}
payport.ecocash.country-code=ZW
payport.ecocash.terminal-id=${ECOCASH_TERMINAL_ID:}
payport.ecocash.location=232 Hebert Chitepo Avenue Harare
payport.ecocash.super-merchant-name=PayPort
payport.ecocash.merchant-name=Payport Financial Services
payport.ecocash.username=${ECOCASH_USERNAME:}
payport.ecocash.password=${ECOCASH_PASSWORD:}

# =====================================================
# ONEMONEY CONFIGURATION
# =====================================================
# NOTE: base-url below is still pointed at an internal IP
# (172.28.255.21) -- verify this is genuinely OneMoney's production
# endpoint before going live, not a UAT/internal address.
payport.onemoney.base-url=${ONEMONEY_BASE_URL:http://172.28.255.21:8087}
payport.onemoney.merchant-no=${ONEMONEY_MERCHANT_NO:}
payport.onemoney.encrypt-key-id=${ONEMONEY_ENCRYPT_KEY_ID:}
payport.onemoney.notify-url=${payport.gateway.callback-base-url}/api/v1/callbacks/onemoney
payport.onemoney.platform-public-key=${ONEMONEY_PLATFORM_PUBLIC_KEY:}
payport.onemoney.merchant-private-key=${ONEMONEY_MERCHANT_PRIVATE_KEY:}

# =====================================================
# OMARI PAYMENT CONFIGURATION
# =====================================================
# NOTE: base-url below still points at Omari's UAT environment
# (omari.v.co.zw/uat/...) -- this must be switched to their production
# base URL before this integration is real. Left as-is here since
# changing it without Omari's actual production URL would break the
# integration outright rather than fix it.
payport.omari.base-url=${OMARI_BASE_URL:https://omari.v.co.zw/uat/vsuite/omari/api/merchant/api/payment}
payport.omari.api-key=${OMARI_API_KEY:}
payport.omari.timeout=30000
payport.omari.test-msisdn=${OMARI_TEST_MSISDN:}

# =====================================================
# ECONET AIRTIME (XML-RPC)
# =====================================================
payport.econet.endpoint=${ECONET_ENDPOINT:}
payport.econet.port=${ECONET_PORT:0}
payport.econet.xmlrpc-path=/xmlrpc
payport.econet.timeout=30000
payport.econet.ssl-verify=false
payport.econet.zwg-username=${ECONET_ZWG_USERNAME:}
payport.econet.zwg-password=${ECONET_ZWG_PASSWORD:}
payport.econet.usd-username=${ECONET_USD_USERNAME:}
payport.econet.usd-password=${ECONET_USD_PASSWORD:}
payport.econet.zwg-currency-code=924
payport.econet.usd-currency-code=840
payport.econet.provider-code=200
payport.econet.company-msisdn=${ECONET_COMPANY_MSISDN:2637870004}

# =====================================================
# NETONE AIRTIME
# =====================================================
payport.netone.base-url=https://pinlessevd.netone.co.zw/api/v1/agents
payport.netone.access-code=${NETONE_ACCESS_CODE:}
payport.netone.access-password=${NETONE_ACCESS_PASSWORD:}
payport.netone.timeout=5000

# =====================================================
# SMS GATEWAY (Africa's Talking)
# =====================================================
# NOTE: username below is still "sandbox" -- this is Africa's Talking's
# TEST mode identifier. Real SMS delivery to customers requires a live
# Africa's Talking account username, not "sandbox".
payport.sms.provider=AFRICAS_TALKING
payport.sms.africas-talking.username=${AFRICAS_TALKING_USERNAME:sandbox}
payport.sms.africas-talking.api-key=${AFRICAS_TALKING_API_KEY:}
payport.sms.africas-talking.sender-id=${AFRICAS_TALKING_SENDER_ID:}
payport.sms.africas-talking.base-url=https://api.sandbox.africastalking.com/version1/messaging

# =====================================================
# ACTUATOR (monitoring)
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# =====================================================
# FILE UPLOAD CONFIGURATION
# =====================================================
payport.upload.logo-directory=/var/payport/uploads/logos
payport.upload.base-url=${payport.gateway.base-url}
payport.upload.kyc-directory=${KYC_UPLOAD_DIRECTORY:/var/payport/uploads/kyc}
payport.upload.query-attachments-directory=${QUERY_ATTACHMENTS_DIRECTORY:/var/payport/uploads/query-attachments}

# =====================================================
# TELECEL AIRTIME
# =====================================================
# Confirmed with the team: Telecel has not yet pointed their integration
# at production -- this currently only works against their test server.
# Expected to work once Telecel completes their side.
payport.telecel.endpoint=https://teleceletopup.telecelzimbabwe.co.zw/EstelTprServices/services/EstelTprServices
payport.telecel.agent-code=${TELECEL_AGENT_CODE:}
payport.telecel.mpin=${TELECEL_MPIN:}
# ZWG is a separate Telecel agent account -- confirmed to exist, credentials
# not yet issued. Leave blank until Telecel provides them; the ZWG balance
# card will honestly show "not configured" rather than guessing.
payport.telecel.zwg-agent-code=${TELECEL_ZWG_AGENT_CODE:}
payport.telecel.zwg-mpin=${TELECEL_ZWG_MPIN:}

# =====================================================
# ZIMSWITCH
# =====================================================
# entity-id / bearer-token are literal placeholder text right now, not
# real credentials -- ZimSwitch is not actually configured. If it's
# selectable as a payment method anywhere in the apps, every attempt
# will fail until real credentials are set here.
payport.zimswitch.base-url=https://eu-test.oppwa.com
payport.zimswitch.entity-id=${ZIMSWITCH_ENTITY_ID:}
payport.zimswitch.bearer-token=${ZIMSWITCH_BEARER_TOKEN:}
payport.zimswitch.notify-url=${payport.gateway.callback-base-url}/api/v1/callbacks/zimswitch
payport.zimswitch.shopper-result-url=${payport.gateway.callback-base-url}/api/v1/callbacks/zimswitch/result

# =====================================================
# e-Solutions Bill Payments Gateway
# =====================================================
# NOTE: base-url below still points at e-Solutions' TEST environment
# (test.esolutions.co.zw) -- this covers ZESA, TelOne, Bulawayo, ZOL,
# Nyaradzo, and Moonlight bill payments. All of these are currently
# running against test, not production, regardless of the credentials
# used. Confirm with e-Solutions whether production access is ready.
payport.esolutions.base-url=${ESOLUTIONS_BASE_URL:https://test.esolutions.co.zw}
payport.esolutions.username=${ESOLUTIONS_USERNAME:}
payport.esolutions.password=${ESOLUTIONS_PASSWORD:}
payport.esolutions.vendor-number=${ESOLUTIONS_VENDOR_NUMBER:}
payport.esolutions.account-number=${ESOLUTIONS_ACCOUNT_NUMBER:}
payport.esolutions.terminal-id=POS001
payport.esolutions.timeout-seconds=15
payport.esolutions.zesa.min-amount-usd-cents=100
payport.esolutions.zesa.max-amount-usd-cents=500000
payport.esolutions.zesa.min-amount-zwg-cents=100
payport.esolutions.zesa.max-amount-zwg-cents=50000000

spring.main.allow-bean-definition-overriding=true

# Suppress CORS cache miss warning (appears once, harmless)
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR

# ── Payport Assistant (chat widget) ──────────────────────────────────
# Free-tier Gemini integration. GEMINI_API_KEY must be set for the
# assistant to work at all -- without it, every request gets the
# configured-fallback reply (see AssistantService), never a broken
# widget, but also never a real answer. Get a free key with no credit
# card required at https://aistudio.google.com/apikey
payport.assistant.gemini.api-key=${GEMINI_API_KEY:}
payport.assistant.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
payport.assistant.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# Gemini 2.5 Flash-Lite's free tier is 1,000 requests/day, shared across
# every visitor to the site combined (not per-visitor). 900 leaves
# headroom rather than racing Gemini's own limit exactly.
payport.assistant.daily-quota=${ASSISTANT_DAILY_QUOTA:900}
payport.assistant.max-message-length=2000
payport.assistant.max-history-turns=20


# =====================================================
# PSP (ledger, payments lifecycle, settlement, recon, wallets, agents, risk, channels)
# See docs/PSP_ARCHITECTURE.md and docs/runbooks/. Secrets come from the environment only.
# =====================================================

# ── Legacy gateway paths now owned by the PSP ─────────────────────────
# The old settlement run and the EcoCash "give up -> FAILED" reconciler are replaced by the
# settlement engine and the uncertain-payment resolver. Keep both false.
payport.legacy.settlement.enabled=false
payport.legacy.ecocash-reconciler.enabled=false

# ── Edge ──────────────────────────────────────────────────────────────
# Proxies whose X-Forwarded-For / X-Client-Cert headers are trusted (mTLS terminates there).
payport.psp.edge.trusted-proxies=${PSP_TRUSTED_PROXIES:127.0.0.1}

# ── Platform ──────────────────────────────────────────────────────────
payport.psp.outbox.poll-ms=2000
payport.psp.outbox.batch-size=100
payport.psp.outbox.max-attempts=15
payport.psp.ledger.integrity-cron=0 30 1 * * *

# ── Payment lifecycle ─────────────────────────────────────────────────
# Callbacks from these providers are confirmed by querying the provider before they change state.
payport.psp.callbacks.verify-by-query=ECOCASH,ONEMONEY,TELECASH
payport.psp.resolver.poll-ms=15000

# ── Merchants ─────────────────────────────────────────────────────────
payport.psp.merchant.enforce-controls=true
payport.psp.merchant.default-products=ECOCASH,ONEMONEY,OMARI,ZIMSWITCH
payport.psp.merchant.payout-cooling-off-hours=24
payport.psp.funds.release-poll-ms=300000

# ── Settlement ────────────────────────────────────────────────────────
# Ledger cash account (bank/trust account code) each currency's payouts are paid from.
payport.psp.settlement.cash-account.USD=${PSP_SETTLEMENT_CASH_USD:TRUST_USD_MAIN}
payport.psp.settlement.cash-account.ZWG=${PSP_SETTLEMENT_CASH_ZWG:TRUST_ZWG_MAIN}
payport.psp.settlement.auto-draft=true
payport.psp.settlement.draft-cron=0 0 6 * * MON-FRI
# true = refuse to build a batch larger than the cash account's ledger balance.
payport.psp.settlement.require-funding-coverage=${PSP_SETTLEMENT_REQUIRE_COVERAGE:false}
payport.psp.settlement.proof-directory=${PSP_SETTLEMENT_PROOF_DIR:/var/payport/uploads/settlement-proofs}

# ── Safeguarding / reconciliation ─────────────────────────────────────
# Comma-separated cash account codes that are trust (safeguarding) accounts.
payport.psp.safeguarding.trust-accounts=${PSP_TRUST_ACCOUNTS:TRUST_USD_MAIN,TRUST_ZWG_MAIN}
payport.psp.recon.bank-check-cron=0 0 7 * * *

# ── Integrations (sandbox adapters must never be enabled in production) ─
payport.psp.integrations.sandbox=${PSP_SANDBOX:false}
payport.psp.kyc.id-verifier=${PSP_KYC_ID_VERIFIER:MANUAL}
payport.psp.kyc.credit-bureau=${PSP_KYC_CREDIT_BUREAU:MANUAL}

# ── FX (ZiG/USD) ──────────────────────────────────────────────────────
payport.psp.fx.max-rate-age-hours=36
payport.psp.fx.customer-spread-bps=150
payport.psp.fx.ingest-cron=0 15 8,14 * * MON-FRI

# ── Fraud ─────────────────────────────────────────────────────────────
payport.psp.risk.review-score=40
payport.psp.risk.block-score=80
# Above this USD-equivalent amount a payment is refused if the fraud engine is unavailable.
payport.psp.risk.fail-closed-above-usd-minor=50000

# ── AML / sanctions ───────────────────────────────────────────────────
payport.psp.aml.potential-match-score=85
payport.psp.aml.auto-freeze-score=97
payport.psp.aml.cash-threshold-usd-minor=1000000
payport.psp.aml.structuring-count=3
payport.psp.aml.rapid-movement-min-usd-minor=50000
payport.psp.aml.many-senders=10
payport.psp.aml.monitoring-cron=0 30 3 * * *
# Automatic UN/OFAC list downloads (needs outbound access to those hosts). Off = upload lists manually.
payport.psp.aml.feeds-enabled=${PSP_AML_FEEDS:false}
payport.psp.aml.refresh-cron=0 0 4 * * *
payport.psp.aml.un-list-url=https://scsanctions.un.org/resources/xml/en/consolidated.xml
payport.psp.aml.ofac-sdn-url=https://www.treasury.gov/ofac/downloads/sdn.csv
payport.psp.aml.ofac-alt-url=https://www.treasury.gov/ofac/downloads/alt.csv

# ── Disputes ──────────────────────────────────────────────────────────
payport.psp.disputes.response-days=7

# ── Biller commissions earned by PayPort (bps of face value), per biller code ─
payport.psp.biller-commission-bps.ZETDC=${PSP_COMMISSION_ZETDC:0}
payport.psp.biller-commission-bps.ECONET=${PSP_COMMISSION_ECONET:0}
payport.psp.biller-commission-bps.NETONE=${PSP_COMMISSION_NETONE:0}
payport.psp.biller-commission-bps.TELECEL=${PSP_COMMISSION_TELECEL:0}

# ── Regulatory reporting ──────────────────────────────────────────────
payport.psp.reporting.monthly-cron=0 0 2 1 * *
payport.psp.reporting.safeguarding-cron=0 15 0 * * *

# ── Notifications ─────────────────────────────────────────────────────
payport.psp.notify.ops-email=${PSP_OPS_EMAIL:}
payport.psp.notify.compliance-email=${PSP_COMPLIANCE_EMAIL:}

# ── Channels ──────────────────────────────────────────────────────────
# USSD aggregator callback (Africa's Talking format). Without a token every request is refused.
payport.psp.ussd.callback-token=${PSP_USSD_CALLBACK_TOKEN:}
payport.psp.ussd.allowed-ips=${PSP_USSD_ALLOWED_IPS:}
# WhatsApp Cloud API. Without app-secret every webhook is refused.
payport.psp.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
payport.psp.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
payport.psp.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
payport.psp.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
payport.psp.whatsapp.api-version=v21.0
payport.psp.whatsapp.use-templates=false
