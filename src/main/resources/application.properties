spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
payport.upload.logo-directory=/var/payport/uploads/logos
payport.upload.base-url=${payport.gateway.base-url}
payport.upload.kyc-directory=${KYC_UPLOAD_DIRECTORY:/var/payport/uploads/kyc}
payport.upload.query-attachments-directory=${QUERY_ATTACHMENTS_DIRECTORY:/var/payport/uploads/query-attachments}

