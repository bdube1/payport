# =====================================================
# PAYPORT GATEWAY - Application Configuration
# =====================================================
#
# Secrets are read from environment variables with no fallback default --
# see .env.example for the full list. Populate your deployment
# environment before starting the app.

spring.application.name=payport-gateway
server.port=8084

# =====================================================
# DATABASE - MYSQL
# =====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =====================================================
# FLYWAY
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# =====================================================
# CONNECTION POOL
# =====================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# =====================================================
# JACKSON
# =====================================================
# Jackson 3 moved this feature from SerializationFeature to DateTimeFeature (Boot 4 property namespace).
# Must stay false: dates as ISO strings, never numeric arrays (frontends call new Date(value)).
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=NON_NULL
# Spring Boot 4 serialises HTTP responses with Jackson 3. Keep Jackson 2's defaults (e.g. property
# order) so API responses stay byte-compatible for existing clients. The app's own ObjectMapper
# bean (AppConfig) is still Jackson 2; moving it to Jackson 3 is a tracked follow-up.
spring.jackson.use-jackson2-defaults=true

# =====================================================
# LOGGING - CLEAN AND QUIET (Only important messages)
# =====================================================
logging.level.root=WARN
logging.level.zw.co.payport=INFO
logging.level.zw.co.payport.gateway.service.adaptor.econet=INFO
logging.level.zw.co.payport.gateway.scheduler.ProviderHealthScheduler=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.apache.http=OFF
logging.level.org.apache.hc.client5.http=OFF
logging.level.org.apache.hc.core5.http=OFF

# Console pattern - clean and readable
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) [%yellow(%thread)] %cyan(%logger{36}) - %msg%n

# =====================================================
# SECURITY - JWT
# =====================================================
payport.security.jwt-secret=${JWT_SECRET}
# Deployment kind. Anything other than local/dev/development/test/ci/sandbox/staging is PRODUCTION
# (the default), which enforces: PAYPORT_DATA_KEY must be set, and the webhook local-testing switches
# below must be off. The application refuses to start otherwise.
payport.environment=${PAYPORT_ENV:production}
# Key for secrets encrypted at rest (webhook signing secrets): base64 of 32 random bytes
# (openssl rand -base64 32). REQUIRED in production. Keep it stable and in the secrets manager:
# changing it makes stored webhook secrets unreadable (merchants would have to rotate them).
payport.security.data-key=${PAYPORT_DATA_KEY:}
# Webhook targets: production must leave both false (SSRF guard, R13). Local testing only.
payport.webhooks.allow-private-targets=${WEBHOOKS_ALLOW_PRIVATE_TARGETS:false}
payport.webhooks.allow-http=${WEBHOOKS_ALLOW_HTTP:false}
payport.security.jwt-expiration-ms=3600000
payport.security.jwt-refresh-expiration-ms=2592000000

# =====================================================
# EMAIL (staff password reset)
# =====================================================
# No defaults on purpose -- if these aren't set, the app still starts (mail
# isn't in the critical startup path) but forgotPassword() will fail loudly
# when actually invoked, which is the right failure mode: better an obvious
# error than a silently undelivered reset email.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
payport.email.from=${SMTP_FROM:no-reply@payport.africa}
payport.email.reset-link-base=https://admin.payport.africa/reset-password

# =====================================================
# GATEWAY CORE SETTINGS
# =====================================================
payport.gateway.base-url=https://api.payport.africa
payport.gateway.callback-base-url=https://api.payport.africa

# Where the consumer app (hosted checkout pages, etc.) is actually
# reachable -- used to build redirect URLs back to it, e.g. after a
# ZimSwitch card payment completes. Override with CONSUMER_BASE_URL in
# .env for local testing (http://localhost:3000); defaults safely to
# production if not set.
payport.consumer.base-url=${CONSUMER_BASE_URL:https://app.payport.africa}
payport.website.base-url=${WEBSITE_BASE_URL:https://www.payport.africa}
payport.gateway.default-currency=USD
payport.gateway.payment-timeout-seconds=180
payport.gateway.max-fulfilment-retries=4
payport.gateway.retry-delays-seconds=30,120,300,600

