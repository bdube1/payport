spring.main.allow-bean-definition-overriding=true

# Suppress CORS cache miss warning (appears once, harmless)
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR

# ── Payport Assistant (chat widget) ──────────────────────────────────
# Free-tier Gemini integration. GEMINI_API_KEY must be set for the
# assistant to work at all -- without it, every request gets the
# configured-fallback reply (see AssistantService), never a broken
# widget, but also never a real answer. Get a free key with no credit
# card required at https://aistudio.google.com/apikey
payport.assistant.gemini.api-key=${GEMINI_API_KEY:}
payport.assistant.gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
payport.assistant.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# Gemini 2.5 Flash-Lite's free tier is 1,000 requests/day, shared across
# every visitor to the site combined (not per-visitor). 900 leaves
# headroom rather than racing Gemini's own limit exactly.
payport.assistant.daily-quota=${ASSISTANT_DAILY_QUOTA:900}
payport.assistant.max-message-length=2000
payport.assistant.max-history-turns=20

# ── Transaction access tokens (Phase 0.5, R3) ───────────────────────
# POST /api/v1/transactions/initiate returns a one-time accessToken; clients send it back as
# the X-Transaction-Token header. false = callers without it get a redacted public view (keeps
# the current consumer app working); set true once the consumer app sends the header, after
# which callers without access get 404.
payport.security.transaction-token.enforce=${TRANSACTION_TOKEN_ENFORCE:false}

# ── Ledger (Phase 1) ─────────────────────────────────────────────────
# Run migrations as a separate migration user (owner of the ledger procedures); the app user
# gets only least-privilege grants (scripts/db/grant-least-privilege.sh). Defaults keep today's
# single-user setup working until the split is made.
spring.flyway.user=${FLYWAY_USER:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD}}
payport.ledger.entity=PAYPORT_ZW
# Observe-only shadow posting of gateway events (ADR-0009). Off until switched on.
payport.ledger.shadow.enabled=${LEDGER_SHADOW_ENABLED:false}
payport.ledger.shadow.interval-ms=60000
payport.ledger.shadow.overlap-minutes=10
payport.ledger.shadow.page-size=500
payport.ledger.integrity-cron=0 15 2 * * *
# Ledger codes of the bank accounts settlements are paid from (finance to confirm the names).
payport.ledger.settlement-bank.USD=SETTLEMENT_USD
payport.ledger.settlement-bank.ZWG=SETTLEMENT_ZWG
# Commission PayPort earns from each vendor, in basis points of face value (finance to confirm; 0 = none recorded).
payport.ledger.vendor-commission-bps.ECONET=0
payport.ledger.vendor-commission-bps.NETONE=0
payport.ledger.vendor-commission-bps.TELECEL=0
payport.ledger.vendor-commission-bps.ESOLUTIONS=0

# =====================================================
# PAYMENT LIFECYCLE (Phase 2)
# =====================================================
# Providers whose callbacks are never trusted on their content: each one is confirmed
# by our own authenticated status query before it changes a payment.
payport.payments.query-providers=${PAYMENT_QUERY_PROVIDERS:ECOCASH,ONEMONEY,ZIMSWITCH,MTN_MOMO,AIRTEL_MONEY}
# Uncertain-outcome resolver (payment_checks) and the pending->timeout watchdog.
payport.payments.resolver.enabled=${PAYMENT_RESOLVER_ENABLED:true}
payport.payments.watchdog.enabled=${PAYMENT_WATCHDOG_ENABLED:true}
# Durable fulfilment jobs (fulfilment_jobs). A delivery with an unknown outcome is never
# repeated; it is resolved by the provider's delivery query, or handed to ops (MANUAL)
# after this many minutes without a definite answer.
payport.fulfilment.worker.enabled=${FULFILMENT_WORKER_ENABLED:true}
payport.fulfilment.unknown-manual-after-minutes=${FULFILMENT_UNKNOWN_MANUAL_AFTER_MINUTES:120}
# Automatic retry of delivery failures whose provider code the provider's specification marks
# as temporary (DeliveryOutcomeRules; Econet, NetOne, e-Solutions). Providers without a code
# table are never retried automatically.
payport.fulfilment.auto-retry=${FULFILMENT_AUTO_RETRY:true}

# Payment intents (Stripe-style). The payment window: when it closes without a definite
# answer the customer is told TIMED_OUT or NO_RESPONSE on the spot. Configurable per provider
# and per channel (most specific wins):
#   payport.payments.window-seconds.<CHANNEL>.<PROVIDER>   e.g. ...window-seconds.USD.ECOCASH
#   payport.payments.window-seconds.<CHANNEL>              e.g. ...window-seconds.USD (USSD)
#   payport.payments.provider-timeout-seconds.<PROVIDER>
#   payport.payments.timeout-seconds                       (default)
# OWNER APPROVAL REQUIRED to change any of these values (pinned by PaymentWindowsTest).
payport.payments.timeout-seconds=${PAYMENT_TIMEOUT_SECONDS:180}
payport.payments.provider-timeout-seconds.ZIMSWITCH=${ZIMSWITCH_TIMEOUT_SECONDS:1800}
payport.payments.provider-timeout-seconds.OMARI=${OMARI_TIMEOUT_SECONDS:300}
# After the window closes, keep asking the provider this long, only to detect a late payment.
# A late payment is never fulfilled: it is refunded (owner rule).
payport.payments.late-detection-hours=${PAYMENT_LATE_DETECTION_HOURS:24}
# A new attempt on the same payment is allowed only after a definite failure, up to this many.
payport.payments.max-attempts=${PAYMENT_MAX_ATTEMPTS:3}

# =====================================================
# RECONCILIATION AND SETTLEMENT (Phase 3)
# =====================================================
payport.recon.timing-tolerance-minutes=${RECON_TIMING_TOLERANCE_MINUTES:60}
# PARALLEL: batches can be drafted and approved next to the legacy settlement, never instructed.
# LIVE: legacy settlement stops; batches can be instructed. Switch only after the parallel run is signed off.
payport.settlement.mode=${SETTLEMENT_MODE:PARALLEL}
payport.settlement.hold-hours=${SETTLEMENT_HOLD_HOURS:24}
payport.settlement.require-reconciled=${SETTLEMENT_REQUIRE_RECONCILED:true}
# Batches above this net total (minor units) need two approvers.
payport.settlement.dual-approval-threshold-minor=${SETTLEMENT_DUAL_APPROVAL_THRESHOLD_MINOR:1000000}
# Automatic settlement (OFF). Switching on = payport.settlement.automation.enabled=true; with
# SETTLEMENT_MODE=LIVE approved batches are also instructed and sent through the payout transport.
payport.settlement.automation.enabled=${SETTLEMENT_AUTOMATION_ENABLED:false}
payport.settlement.automation.cron=${SETTLEMENT_AUTOMATION_CRON:0 30 6 * * *}
payport.settlement.automation.currencies=${SETTLEMENT_AUTOMATION_CURRENCIES:USD,ZWG}
# Batches up to this net total (minor units) may be approved by the automatic policy; 0 = people approve every batch.
payport.settlement.automation.auto-approve-limit-minor=${SETTLEMENT_AUTO_APPROVE_LIMIT_MINOR:0}

# =====================================================
# Push notifications (owner decision 2026-10-16: yes). Expo push service, used by payport-mobile.
# Every final payment outcome is pushed (SMS stays success-only). EXPO_ACCESS_TOKEN is optional
# (needed only if "enhanced push security" is turned on in the Expo project).
# =====================================================
payport.push.enabled=${PUSH_ENABLED:true}
payport.push.expo-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
payport.push.expo-access-token=${EXPO_ACCESS_TOKEN:}

# =====================================================
# Risk and compliance (Phase 6). Rule thresholds live in risk_rules and change only with two
# compliance officers. The values below are PROVISIONAL and must be confirmed by compliance:
#  - dispute deadlines against the RBZ rules;
#  - the case SLA against internal policy.
# =====================================================
payport.compliance.reporting-entity=${COMPLIANCE_REPORTING_ENTITY:PayPort (Private) Limited}
payport.compliance.case-sla-days=5
payport.disputes.sla.acknowledge-hours=48
payport.disputes.sla.resolve-days=30

# ── Phase 8: new-market mobile money, WhatsApp (all empty = switched off / fails closed) ──
payport.mtn-momo.base-url=${MTN_MOMO_BASE_URL:}
payport.mtn-momo.subscription-key=${MTN_MOMO_SUBSCRIPTION_KEY:}
payport.mtn-momo.api-user=${MTN_MOMO_API_USER:}
payport.mtn-momo.api-key=${MTN_MOMO_API_KEY:}
payport.mtn-momo.target-environment=${MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
payport.mtn-momo.callback-url=${MTN_MOMO_CALLBACK_URL:}
payport.airtel-money.base-url=${AIRTEL_MONEY_BASE_URL:}
payport.airtel-money.client-id=${AIRTEL_MONEY_CLIENT_ID:}
payport.airtel-money.client-secret=${AIRTEL_MONEY_CLIENT_SECRET:}
payport.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
payport.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
payport.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
payport.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
