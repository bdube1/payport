<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${title}, ${description}, ${image}, ${store.color}, ${share.url})}"></head>
<body>
<header th:replace="~{fragments :: top(${store})}"></header>
<main class="wrap narrow">
  <img th:if="${link.image != null}" th:src="${link.image}" alt="" class="hero-pic">
  <h1 th:text="${link.title}">Payment</h1>
  <p th:if="${link.description != null}" th:text="${link.description}" class="desc"></p>
  <p th:if="${link.reference != null}" class="muted" th:text="'Reference ' + ${link.reference}"></p>
  <p th:if="${link.fixed}" class="price big" th:text="${link.price}">USD 1.00</p>
  <p th:if="${problem != null}" th:text="${problem}" class="notice" role="alert"></p>
  <p th:unless="${link.open}" th:text="${link.closedReason}" class="notice"></p>
  <form th:if="${link.open}" method="post" th:action="@{/l/{c}/pay(c=${link.code})}" class="buy">
    <input type="hidden" name="k" th:value="${key}">
    <label th:unless="${link.fixed}">Amount (<span th:text="${link.currency}">USD</span>)
      <input name="amount" inputmode="decimal" required pattern="[0-9]+([.][0-9]{1,2})?" th:placeholder="${link.min != null ? link.min : '0.00'}">
    </label>
    <p th:if="${!link.fixed and (link.min != null or link.max != null)}" class="muted small">
      <span th:if="${link.min != null}" th:text="'From ' + ${link.currency} + ' ' + ${link.min}"></span>
      <span th:if="${link.max != null}" th:text="' up to ' + ${link.currency} + ' ' + ${link.max}"></span>
    </p>
    <label>Your name <input name="name" maxlength="120" autocomplete="name"></label>
    <label>Phone <input name="phone" maxlength="20" inputmode="tel" autocomplete="tel"></label>
    <label>Note <input name="note" maxlength="300"></label>
    <button type="submit" class="pay">Pay</button>
  </form>
  <section th:replace="~{fragments :: share(${share})}"></section>
</main>
<footer th:replace="~{fragments :: foot}"></footer>
</body>
</html>
