<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${title}, ${description}, ${image}, ${store.color}, ${share.url})}"></head>
<body>
<header th:replace="~{fragments :: top(${store})}"></header>
<main class="wrap narrow">
  <img th:if="${product.image != null}" th:src="${product.image}" alt="" class="hero-pic">
  <h1 th:text="${product.name}">Product</h1>
  <p th:if="${product.rating != null}" class="stars" th:text="${product.rating}"></p>
  <p class="price big"><span th:text="${product.price}">USD 1.00</span> <s th:if="${product.was != null}" class="was" th:text="${product.was}"></s></p>
  <p th:if="${product.description != null}" th:text="${product.description}" class="desc"></p>
  <p th:if="${problem != null}" th:text="${problem}" class="notice" role="alert"></p>
  <p th:if="${product.soldOut}" class="notice">Sold out</p>
  <p th:if="${product.few != null and !product.service}" class="muted" th:text="${product.few}"></p>
  <form th:if="${store.open and !product.soldOut}" method="post" th:action="${product.url + '/buy'}" class="buy">
    <label th:unless="${product.service}">Quantity <input name="qty" type="number" min="1" max="20" value="1" inputmode="numeric" required></label>
    <input th:if="${product.service}" type="hidden" name="qty" value="1">
    <button type="submit" class="pay" th:text="${product.service} ? 'Book' : 'Add to cart'">Add to cart</button>
  </form>
  <p th:unless="${store.open}" class="notice">This store is not taking orders at the moment.</p>
  <section th:if="${!#lists.isEmpty(reviews)}" class="reviews">
    <h2>Reviews</h2>
    <div th:each="r : ${reviews}" class="review">
      <p><span class="stars" th:text="${r.stars}"></span> <strong th:text="${r.name}"></strong> <span class="muted small" th:text="${r.date}"></span></p>
      <p th:if="${r.comment != null}" th:text="${r.comment}"></p>
      <p th:if="${r.reply != null}" class="reply muted small" th:text="'Reply: ' + ${r.reply}"></p>
    </div>
  </section>
  <section th:if="${!#lists.isEmpty(also)}" class="also">
    <h2>Customers also bought</h2>
    <ul class="grid">
      <li th:each="a : ${also}" class="card">
        <a th:href="${a.url}">
          <img th:if="${a.image != null}" th:src="${a.image}" alt="" loading="lazy" class="pic">
          <div th:if="${a.image == null}" class="pic blank"></div>
          <span class="name" th:text="${a.name}">Product</span>
          <span class="price"><span th:text="${a.price}">USD 1.00</span> <s th:if="${a.was != null}" class="was" th:text="${a.was}"></s></span>
        </a>
      </li>
    </ul>
  </section>
  <section th:replace="~{fragments :: share(${share})}"></section>
</main>
<footer th:replace="~{fragments :: foot}"></footer>
</body>
</html>
