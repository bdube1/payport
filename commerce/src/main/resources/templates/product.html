<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head(${title}, ${description}, ${image}, ${store.color}, ${share.url})}"></head>
<body>
<header th:replace="~{fragments :: top(${store})}"></header>
<main class="wrap narrow">
  <img th:if="${product.image != null}" th:src="${product.image}" alt="" class="hero-pic">
  <h1 th:text="${product.name}">Product</h1>
  <p class="price big" th:text="${product.price}">USD 1.00</p>
  <p th:if="${product.description != null}" th:text="${product.description}" class="desc"></p>
  <p th:if="${problem != null}" th:text="${problem}" class="notice" role="alert"></p>
  <form th:if="${store.open}" method="post" th:action="${product.url + '/buy'}" class="buy">
    <input type="hidden" name="k" th:value="${key}">
    <label>Quantity <input name="qty" type="number" min="1" max="20" value="1" inputmode="numeric" required></label>
    <label>Your name <input name="name" maxlength="120" autocomplete="name"></label>
    <label>Phone <input name="phone" maxlength="20" inputmode="tel" autocomplete="tel"></label>
    <label>Note for the seller <input name="note" maxlength="300"></label>
    <button type="submit" class="pay">Buy now</button>
  </form>
  <p th:unless="${store.open}" class="notice">This store is not taking orders at the moment.</p>
  <section th:replace="~{fragments :: share(${share})}"></section>
</main>
<footer th:replace="~{fragments :: foot}"></footer>
</body>
</html>
