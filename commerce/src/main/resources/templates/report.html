<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="${title}">Report</title>
  <link rel="stylesheet" th:href="@{/assets/store.css}">
  <script th:src="@{/assets/store.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments :: top(${store})}"></header>
<main class="wrap narrow">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="/">Stores</a><span class="sep">/</span>
    <a th:href="@{/s/{s}(s=${store.slug})}" th:text="${store.name}">Store</a><span class="sep">/</span>
    <b>Report</b>
  </nav>
  <h1 th:text="'Report ' + ${store.name}">Report</h1>
  <div th:if="${done}" class="notice ok" role="status">
    <span>Thank you. Payport customer care will look into it.</span>
    <span th:if="${ref != null and ref != ''}" th:text="' Your reference is ' + ${ref} + '.'"></span>
  </div>
  <p th:if="${problem != null}" th:text="${problem}" class="notice" role="alert"></p>
  <form th:unless="${done}" method="post" th:action="@{/s/{s}/report(s=${store.slug})}" class="buy">
    <label>What happened?
      <select name="reason" required>
        <option value="">Choose</option>
        <option th:each="r : ${reasons}" th:value="${r.key}" th:text="${r.value}">Reason</option>
      </select></label>
    <label>Details <textarea name="details" maxlength="1000"></textarea></label>
    <label>Your phone (for the reference by SMS) <input name="phone" maxlength="20" inputmode="tel" autocomplete="tel" th:value="${me != null ? me.phone : ''}"></label>
    <button type="submit" class="pay">Send report</button>
  </form>
  <a th:href="@{/s/{s}(s=${store.slug})}" class="sh">Back to the store</a>
</main>
<footer th:replace="~{fragments :: foot}"></footer>
</body>
</html>
