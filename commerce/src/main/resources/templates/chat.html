<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="${title}">Chat</title>
  <link rel="stylesheet" th:href="@{/assets/store.css}">
  <script th:src="@{/assets/store.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments :: top(${store})}"></header>
<main class="wrap narrow">
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="/">Stores</a><span class="sep">/</span>
    <a th:href="@{/s/{s}(s=${store.slug})}" th:text="${store.name}">Store</a><span class="sep">/</span>
    <b>Contact seller</b>
  </nav>
  <p th:if="${problem != null}" th:text="${problem}" class="notice" role="alert"></p>
  <section class="chat-box">
    <div class="chat-head">
      <strong th:text="${store.name}">Store</strong>
      <a th:if="${store.whatsapp != null}" th:href="${store.whatsapp}" class="btn-soft" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <div class="chat-log" data-chat th:attr="data-poll=@{/s/{s}/chat/messages(s=${store.slug})},data-after=${lastId}">
      <p th:if="${#lists.isEmpty(messages)}" class="chat-empty" data-empty>Ask the seller anything before you order or pay.</p>
      <div th:each="m : ${messages}" class="msg" th:classappend="${m.from}"><span th:text="${m.text}"></span><small th:text="${m.time}"></small></div>
      <span id="end"></span>
    </div>
    <form method="post" th:action="@{/s/{s}/chat(s=${store.slug})}" class="chat-form">
      <input th:if="${productId != null}" type="hidden" name="p" th:value="${productId}">
      <p th:if="${about != null}" class="muted small" th:text="'About: ' + ${about}"></p>
      <div class="chat-send">
        <textarea name="text" maxlength="1000" required placeholder="Type a message" aria-label="Message"></textarea>
        <button type="submit" class="pay">Send</button>
      </div>
      <p class="muted small">Messages are encrypted and kept on your <a href="/messages">Messages</a> page. Pay only through Payport.</p>
    </form>
  </section>
  <a th:href="@{/s/{s}/report(s=${store.slug})}" class="report-link">Report this store</a>
</main>
<footer th:replace="~{fragments :: foot}"></footer>
</body>
</html>
