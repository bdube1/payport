<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="${title}">Cart</title>
  <link rel="stylesheet" href="/assets/store.css">
  <link rel="stylesheet" th:href="@{/theme.css(c=${#strings.substring(store.color, 1)})}">
  <script src="/assets/store.js" defer></script>
</head>
<body>
<header th:replace="~{fragments :: top(${store})}"></header>
<main class="wrap narrow">
  <h1>Your cart</h1>
  <p th:if="${problem != null}" th:text="${problem}" class="notice" role="alert"></p>
  <div th:if="${cart.empty}">
    <p class="muted">Your cart is empty.</p>
    <a class="pay link-btn" th:href="@{/s/{s}(s=${store.slug})}">Continue shopping</a>
  </div>
  <div th:unless="${cart.empty}">
    <ul class="lines">
      <li th:each="l : ${cart.lines}" class="line">
        <img th:if="${l.image != null}" th:src="${l.image}" alt="" class="thumb">
        <div class="line-main">
          <a th:href="@{/s/{s}/{p}(s=${store.slug},p=${l.slug})}" class="line-name" th:text="${l.name}">Item</a>
          <span class="muted small" th:text="${l.unit}">USD 1.00</span>
          <span th:if="${l.problem != null}" class="warn small" th:text="${l.problem}"></span>
        </div>
        <form method="post" th:action="@{/s/{s}/cart/{p}(s=${store.slug},p=${l.productId})}" class="qty">
          <input name="qty" type="number" min="0" max="50" th:value="${l.quantity}" inputmode="numeric" aria-label="Quantity">
          <button type="submit" class="sh">Update</button>
        </form>
        <span class="line-total" th:text="${l.line}">USD 1.00</span>
      </li>
    </ul>
    <p class="sum"><span>Items</span><strong th:text="${cart.items}">USD 1.00</strong></p>
    <p th:if="${cart.discount != null}" class="sum"><span th:text="'Discount ' + ${cart.code}">Discount</span><strong th:text="'−' + ${cart.discount}">USD 1.00</strong></p>
    <form method="get" th:action="@{/s/{s}/cart(s=${store.slug})}" class="code-form">
      <input name="code" th:value="${cart.code}" placeholder="Discount code" aria-label="Discount code" maxlength="30" autocapitalize="characters">
      <button type="submit" class="sh">Apply</button>
    </form>
    <form th:if="${store.open}" method="post" th:action="@{/s/{s}/checkout(s=${store.slug})}" class="buy">
      <input type="hidden" name="k" th:value="${key}">
      <input th:if="${cart.code != null}" type="hidden" name="code" th:value="${cart.code}">
      <p th:if="${cart.servicesOnly}" class="sum"><span>Total</span><strong th:text="${cart.total}">USD 1.00</strong></p>
      <fieldset th:unless="${cart.servicesOnly}" class="choice">
        <legend>How do you want it?</legend>
        <label th:if="${cart.pickup}" class="opt"><input type="radio" name="method" value="PICKUP" th:checked="${!cart.delivery}" required>
          <span><strong>Pickup</strong> <span th:text="${cart.totalPickup}"></span><br><span class="muted small" th:if="${cart.pickupNote != null}" th:text="${cart.pickupNote}"></span></span></label>
        <label th:if="${cart.delivery}" class="opt"><input type="radio" name="method" value="DELIVERY" th:checked="${!cart.pickup}" required>
          <span><strong>Delivery</strong> <span th:text="${cart.totalDelivery}"></span> <span class="muted small" th:text="'(delivery ' + ${cart.fee} + ')'"></span><br><span class="muted small" th:if="${cart.deliveryNote != null}" th:text="${cart.deliveryNote}"></span></span></label>
      </fieldset>
      <label th:if="${cart.delivery and !cart.servicesOnly}">Delivery address <input name="address" maxlength="300" autocomplete="street-address"></label>
      <label>Your name <input name="name" maxlength="120" autocomplete="name" required></label>
      <label>Phone <input name="phone" maxlength="20" inputmode="tel" autocomplete="tel" required></label>
      <label>Note for the seller <input name="note" maxlength="300"></label>
      <fieldset th:if="${cart.cod}" class="choice">
        <legend>How do you want to pay?</legend>
        <label class="opt"><input type="radio" name="pay" value="ONLINE" checked> <span><strong>Pay now</strong> <span class="muted small">EcoCash, OneMoney, card</span></span></label>
        <label class="opt"><input type="radio" name="pay" value="CASH"> <span><strong th:text="${cart.servicesOnly} ? 'Pay at the appointment' : 'Pay on delivery or collection'">Pay on delivery</strong></span></label>
      </fieldset>
      <button type="submit" class="pay" th:disabled="${!cart.ok}" th:text="${cart.cod} ? 'Place order' : 'Pay'">Pay</button>
    </form>
    <p th:unless="${store.open}" class="notice">This store is not taking orders at the moment.</p>
  </div>
</main>
<footer th:replace="~{fragments :: foot}"></footer>
</body>
</html>
