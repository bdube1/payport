# Payport Commerce. Secrets come from the environment (.env.commerce on the server), never from this file.
spring.application.name=payport-commerce
server.port=${PORT:8086}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.compression.enabled=true
server.servlet.session.persistent=false

spring.datasource.url=${COMMERCE_DB_URL}
spring.datasource.username=${COMMERCE_DB_USERNAME}
spring.datasource.password=${COMMERCE_DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# chat videos are up to 16 MB (each upload checks its own limit: pictures 3 MB)
spring.servlet.multipart.max-file-size=17MB
spring.servlet.multipart.max-request-size=17MB
spring.thymeleaf.cache=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Where Payport Payments is, and the service key it expects (PAYPORT_COMMERCE_KEY on both sides).
commerce.psp-url=${PAYPORT_PSP_URL:http://127.0.0.1:8085}
commerce.psp-key=${PAYPORT_COMMERCE_KEY:}
# Signs merchant sessions in Commerce (at least 32 characters).
commerce.token-secret=${COMMERCE_TOKEN_SECRET:}
# Public address of the store pages, and the merchant portal(s) allowed to call the merchant API.
commerce.public-url=${COMMERCE_PUBLIC_URL:https://store.payport.africa}
# The line across the top of the Payport Store front page (empty: none).
commerce.directory-announcement=${COMMERCE_DIRECTORY_ANNOUNCEMENT:Free delivery this weekend at selected stores}
# Payport AI in the store: a language model key turns on written answers and product descriptions (the built-in assistant works without one).
commerce.ai.api-key=${COMMERCE_AI_API_KEY:}
# Chat messages, names and phone numbers are kept encrypted with this key (base64 of 32 bytes: openssl rand -base64 32).
commerce.data-key=${COMMERCE_DATA_KEY:}
commerce.ai.model=${COMMERCE_AI_MODEL:claude-sonnet-5-5}
commerce.portal-origins=${COMMERCE_PORTAL_ORIGINS:https://merchant.payport.africa}
# The PSP's hosted checkout (where customers are sent to pay).
# Empty: worked out from the store address (store.payport.africa pays on app.payport.africa, store-staging on app-staging).
commerce.checkout-origin=${COMMERCE_CHECKOUT_ORIGIN:}
commerce.events.poll-ms=${COMMERCE_EVENTS_POLL_MS:4000}
# Stylesheets and scripts get a content-hashed address (store-<hash>.css), so a new release is always loaded
# and browsers may keep each version for a year.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/assets/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Scaling out: only one server runs the scheduled jobs (see SchedulingConfig)
commerce.scheduling.enabled=${COMMERCE_SCHEDULING_ENABLED:true}
