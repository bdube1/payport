# PayPort staging behind https (owner, 2026-10-25). Installed by scripts/staging/setup-staging-domains.sh;
# certbot adds the TLS lines and the http→https redirect to each server block.
#   admin-staging.payport.africa     → ops portal       /opt/payport/staging-ops/dist       (static)
#   app-staging.payport.africa       → consumer portal  /opt/payport/staging-consumer/dist  (static)
#   merchant-staging.payport.africa  → merchant/agent   /opt/payport/staging-merchant/dist  (static)
#   api-staging.payport.africa       → gateway          127.0.0.1:8085
# The portals are served straight from their builds (no Node process): compressed, and the hashed files under
# /assets are cached by the browser for a year, so only index.html is fetched again after a deploy.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    include /etc/nginx/snippets/payport-gzip.conf;
    server_name admin-staging.payport.africa;
    root /opt/payport/staging-ops/dist;
    include /etc/nginx/snippets/payport-spa.conf;
}

server {
    listen 80;
    include /etc/nginx/snippets/payport-gzip.conf;
    server_name app-staging.payport.africa;
    root /opt/payport/staging-consumer/dist;
    include /etc/nginx/snippets/payport-spa.conf;
}

server {
    listen 80;
    include /etc/nginx/snippets/payport-gzip.conf;
    server_name merchant-staging.payport.africa;
    root /opt/payport/staging-merchant/dist;
    include /etc/nginx/snippets/payport-spa.conf;
}

server {
    listen 80;
    include /etc/nginx/snippets/payport-gzip.conf;
    server_name api-staging.payport.africa;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/payport-proxy.conf;
        proxy_read_timeout 120s;
    }
}
