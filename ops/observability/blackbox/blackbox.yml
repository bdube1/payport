modules:
  http_2xx:
    prober: http
    timeout: 10s
    http: { preferred_ip_protocol: ip4, valid_status_codes: [] }
  # A provider callback address: any HTTP answer means it reaches the gateway (providers POST; a GET gets 405).
  http_any:
    prober: http
    timeout: 10s
    http: { preferred_ip_protocol: ip4, valid_status_codes: [200, 204, 400, 401, 403, 404, 405] }
  tcp_connect:
    prober: tcp
    timeout: 6s
    tcp: { preferred_ip_protocol: ip4 }
  icmp:
    prober: icmp
    timeout: 5s
    icmp: { preferred_ip_protocol: ip4 }
