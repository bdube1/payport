server: { http_listen_address: 127.0.0.1, http_listen_port: 3200, grpc_listen_address: 127.0.0.1, grpc_listen_port: 9097 }
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 127.0.0.1:4317 }
        http: { endpoint: 127.0.0.1:4318 }
storage:
  trace:
    backend: local
    local: { path: /var/tempo/traces }
    wal: { path: /var/tempo/wal }
compactor:
  compaction: { block_retention: 168h }
usage_report:
  reporting_enabled: false
